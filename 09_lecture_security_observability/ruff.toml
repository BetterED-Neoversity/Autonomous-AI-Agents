# Набір правил для демо лекції 09. Свідомо вужчий за дефолт редактора: демо
# пишеться так, щоб читалось із проєктора, і частина стилістичних зауважень тут
# шкідлива — приклади навмисно тримають однакову форму у всіх скриптах, навіть
# коли лінтер бачить у цьому повтор.
target-version = "py312"
line-length = 100

[lint]
# E4/E7/E9 + F — дефолт ruff (імпорти, синтаксис, невикористані імена).
# ASYNC — ловить справжні баги: блокуючі виклики всередині event loop (ASYNC220).
select = ["E4", "E7", "E9", "F", "ASYNC"]

[lint.per-file-ignores]
# s4c, s5b і s6b мусять виставити змінні оточення ДО імпорту
# langsmith/deepteam/deepeval: бібліотеки читають їх на імпорті, тому імпорти
# тут навмисно нижче коду.
"s4c_langsmith.py" = ["E402"]
"s5b_deepteam.py" = ["E402"]
"s6b_deepeval.py" = ["E402"]
